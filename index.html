<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Симулятор сейфа клуба "Читатели"</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f131a;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #111722;
      image-rendering: auto;
      touch-action: none;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #eee;
      background: #111;
      z-index: 50;
      text-align: center;
      padding: 24px;
    }

    .mobile-controls {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 420px);
      display: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pad-actions {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .mobile-controls button {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(24, 28, 36, 0.88);
      color: #f1f4fa;
      border-radius: 10px;
      font: 700 20px Consolas, "Courier New", monospace;
      padding: 14px 10px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .mobile-controls button:active {
      transform: scale(0.98);
      background: rgba(40, 48, 62, 0.95);
    }

    @media (max-width: 900px), (pointer: coarse) {
      .mobile-controls { display: block; }
    }

    .team-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2, 6, 12, 0.62);
      backdrop-filter: blur(8px);
    }

    .team-modal-backdrop.is-open {
      display: flex;
    }

    .team-modal {
      width: min(92vw, 460px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 22px;
      background: linear-gradient(180deg, rgba(32, 39, 52, 0.98), rgba(16, 22, 32, 0.98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      color: #eef2f7;
    }

    .team-modal h2 {
      margin: 0 0 14px;
      font: 800 22px Inter, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0.02em;
      color: #d7b65a;
    }

    .team-modal label {
      display: block;
      margin-bottom: 8px;
      color: #aeb7c6;
      font: 600 14px Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .team-modal input {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 14px 15px;
      outline: none;
      background: rgba(6, 12, 20, 0.82);
      color: #ffffff;
      font: 700 18px Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .team-modal input:focus {
      border-color: rgba(85, 214, 111, 0.85);
      box-shadow: 0 0 0 3px rgba(85, 214, 111, 0.14);
    }

    .team-modal .modal-error {
      min-height: 20px;
      margin: 10px 0 12px;
      color: #f06464;
      font: 600 13px Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .team-modal button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      color: #08100b;
      background: linear-gradient(180deg, #64e987, #37bd61);
      font: 900 18px Inter, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 24px rgba(55, 189, 97, 0.25);
    }

    .team-modal button:disabled {
      opacity: 0.62;
      cursor: wait;
    }

  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="mobileControls" class="mobile-controls">
    <div class="pad-grid">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>

      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>

      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>

      <button data-key="back">⌫</button>
      <button data-key="0">0</button>
      <button data-key="enter">OK</button>
    </div>
    <div class="pad-actions">
      <button data-key="reset">R</button>
    </div>
  </div>

  <div class="fallback" id="fallback">Canvas не поддерживается. Поздравляю, вы открыли страницу на чем-то музейном.</div>


  <div id="teamModalBackdrop" class="team-modal-backdrop" aria-hidden="true">
    <div class="team-modal" role="dialog" aria-modal="true" aria-labelledby="teamModalTitle">
      <h2 id="teamModalTitle">Введите название команды</h2>
      <label for="teamNameInput">Название команды</label>
      <input id="teamNameInput" type="text" maxlength="80" autocomplete="off" placeholder="Например: Команда №1" />
      <div id="teamModalError" class="modal-error"></div>
      <button id="finishTeamButton" type="button">Закончить!</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics, isSupported as analyticsSupported } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
    import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    (() => {
      const canvas = document.getElementById("app");
      const fallback = document.getElementById("fallback");
      const mobileControls = document.getElementById("mobileControls");
      const teamModalBackdrop = document.getElementById("teamModalBackdrop");
      const teamNameInput = document.getElementById("teamNameInput");
      const teamModalError = document.getElementById("teamModalError");
      const finishTeamButton = document.getElementById("finishTeamButton");
      const ctx = canvas.getContext("2d");

      if (!ctx) {
        fallback.style.display = "flex";
        return;
      }

      // -----------------------------
      // Firebase
      // -----------------------------
      const firebaseConfig = {
        apiKey: "AIzaSyCj33JmCcHn4K9E7kzb2Lo6v5rY590eBJA",
        authDomain: "safesim-4fd0f.firebaseapp.com",
        projectId: "safesim-4fd0f",
        databaseURL: "https://safesim-4fd0f-default-rtdb.firebaseio.com/",
        storageBucket: "safesim-4fd0f.firebasestorage.app",
        messagingSenderId: "585794180953",
        appId: "1:585794180953:web:be6a421079b9f035901e48",
        measurementId: "G-NHFW2P75QX"
      };

      const fbApp = initializeApp(firebaseConfig);
      const db = getDatabase(fbApp);
      analyticsSupported().then(ok => { if (ok) getAnalytics(fbApp); }).catch(() => {});
      const SAFE_CODE_PATH = "safeCodes/global";

      // Google Apps Script Web App URL для записи результатов в таблицу.
      // Сначала создай Apps Script, опубликуй его как Web App и вставь URL сюда.
      const RESULTS_WEB_APP_URL = "https://script.google.com/macros/s/akfycbyrburw2hm_igwc4iwflemntwotzrrsmkrd98k5_dtkcmexv0v8msdriwglixpxjncf/exec";

      // -----------------------------
      // Базовые настройки
      // -----------------------------
      const BASE_W = 960;
      const BASE_H = 640;
      const MAX_DIGITS = 6;
      const DEFAULT_MAIN_CODE = "472915";
      const MASTER_SET_MAIN = "1990";

      // -----------------------------
      // Состояния
      // -----------------------------
      const STATE = {
        INPUT: "input",
        SET_MAIN: "set_main",
        OPENING: "opening",
        OPEN: "open",
        ERROR: "error",
      };

      // -----------------------------
      // Цвета
      // -----------------------------
      const COLORS = {
        GREEN: "#55d66f",
        RED: "#f06464",
        YELLOW: "#d7b65a",
        TEXT: "#eef2f7",
        DIM: "#9aa4b2",
        ACCENT: "#d7b65a",
        DISPLAY_BG: "#06170f",
        DISPLAY_EDGE: "#208c59",
        DISPLAY_TEXT: "#60f59a",
      };

      // -----------------------------
      // Размеры/масштаб
      // -----------------------------
      let WIDTH = 0, HEIGHT = 0, uiScale = 1;
      const SAFE_SCENE_SCALE = 0.55;

      // Мобильные настройки компоновки.
      const MOBILE_VISUAL_BOOST = 1.50;
      const MOBILE_KEYPAD_GAP = 14;
      const MOBILE_SAFE_Y_BIAS = -6;
      const MOBILE_TOP_SAFE_GAP = 12;

      function S(v) {
        return Math.max(1, Math.round(v * uiScale));
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rectW = window.innerWidth;
        const rectH = window.innerHeight;

        canvas.width = Math.floor(rectW * dpr);
        canvas.height = Math.floor(rectH * dpr);
        canvas.style.width = rectW + "px";
        canvas.style.height = rectH + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        WIDTH = rectW;
        HEIGHT = rectH;
        uiScale = Math.min(WIDTH / BASE_W, HEIGHT / BASE_H);
      }

      // -----------------------------
      // Утилиты
      // -----------------------------
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      function easeOutCubic(t) {
        t = clamp(t, 0, 1);
        return 1 - Math.pow(1 - t, 3);
      }

      function displayDigits(s) {
        let out = "";
        for (let i = 0; i < MAX_DIGITS; i++) out += i < s.length ? s[i] : "_";
        return out;
      }

      function roundedRectPath(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawText(text, x, y, color, px, align = "center", weight = "700", family = "Inter, Segoe UI, Roboto, Arial, sans-serif") {
        ctx.fillStyle = color;
        ctx.font = `${weight} ${px}px ${family}`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(text, x, y);
      }

      function drawImageScaled(img, x, y, w, h) {
        if (!img) return;
        ctx.drawImage(img, x, y, w, h);
      }

      function drawModernBackground() {
        const g = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
        g.addColorStop(0, "#101722");
        g.addColorStop(0.55, "#0c1119");
        g.addColorStop(1, "#080b10");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const glow1 = ctx.createRadialGradient(WIDTH * 0.30, HEIGHT * 0.20, 0, WIDTH * 0.30, HEIGHT * 0.20, WIDTH * 0.55);
        glow1.addColorStop(0, "rgba(76, 103, 142, 0.18)");
        glow1.addColorStop(1, "rgba(76, 103, 142, 0)");
        ctx.fillStyle = glow1;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const glow2 = ctx.createRadialGradient(WIDTH * 0.72, HEIGHT * 0.82, 0, WIDTH * 0.72, HEIGHT * 0.82, WIDTH * 0.45);
        glow2.addColorStop(0, "rgba(40, 60, 88, 0.14)");
        glow2.addColorStop(1, "rgba(40, 60, 88, 0)");
        ctx.fillStyle = glow2;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      function drawModernTopPanel(x, y, w, h) {
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
        ctx.shadowBlur = S(18);
        ctx.shadowOffsetY = S(8);

        roundedRectPath(x, y, w, h, S(18));
        const panelGradient = ctx.createLinearGradient(x, y, x, y + h);
        panelGradient.addColorStop(0, "rgba(35, 42, 54, 0.96)");
        panelGradient.addColorStop(1, "rgba(24, 30, 40, 0.92)");
        ctx.fillStyle = panelGradient;
        ctx.fill();

        ctx.shadowColor = "transparent";
        ctx.lineWidth = Math.max(1, S(1));
        ctx.strokeStyle = "rgba(255, 255, 255, 0.10)";
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + S(18), y + S(1));
        ctx.lineTo(x + w - S(18), y + S(1));
        ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
        ctx.stroke();
        ctx.restore();
      }

      // -----------------------------
      // localStorage + Firebase
      // -----------------------------
      function loadCodeLocal() {
        const main = localStorage.getItem("safe_main_code") || DEFAULT_MAIN_CODE;
        return /^\d{6}$/.test(main) ? main : DEFAULT_MAIN_CODE;
      }

      function saveCodeLocal(main) {
        try {
          localStorage.setItem("safe_main_code", main);
          return true;
        } catch (e) {
          console.warn("localStorage недоступен:", e);
          return false;
        }
      }

      async function loadCodeFromCloud() {
        try {
          const snap = await get(ref(db, SAFE_CODE_PATH));
          if (!snap.exists()) {
            const defaults = { main_code: DEFAULT_MAIN_CODE, updated_at: Date.now() };
            await set(ref(db, SAFE_CODE_PATH), defaults);
            saveCodeLocal(defaults.main_code);
            return defaults.main_code;
          }

          const data = snap.val() || {};
          const main = /^\d{6}$/.test(data.main_code || "") ? data.main_code : DEFAULT_MAIN_CODE;
          saveCodeLocal(main);
          return main;
        } catch (e) {
          console.warn("Не удалось загрузить код из Firebase, используем localStorage:", e);
          return loadCodeLocal();
        }
      }

      async function saveCodeToCloud(main) {
        try {
          await set(ref(db, SAFE_CODE_PATH), {
            main_code: main,
            updated_at: Date.now()
          });
          saveCodeLocal(main);
          return true;
        } catch (e) {
          console.warn("Не удалось сохранить код в Firebase:", e);
          return saveCodeLocal(main);
        }
      }

      function subscribeToCode(onCode) {
        try {
          onValue(ref(db, SAFE_CODE_PATH), (snap) => {
            if (!snap.exists()) return;
            const data = snap.val() || {};
            const main = /^\d{6}$/.test(data.main_code || "") ? data.main_code : DEFAULT_MAIN_CODE;
            saveCodeLocal(main);
            onCode(main);
          });
        } catch (e) {
          console.warn("Подписка Firebase не работает:", e);
        }
      }

      let MAIN_CODE = DEFAULT_MAIN_CODE;

      // -----------------------------
      // Состояние приложения
      // -----------------------------
      let appState = STATE.INPUT;
      let entered = "";
      let message = "Введите 6-значный код";
      let messageColor = COLORS.DIM;

      let openProgress = 0;
      let continueButtonRect = null;
      let resultSubmitted = false;
      let isSubmittingResult = false;
      let shakeTimer = 0;
      let errorFlash = 0;
      let lastTime = performance.now();

      // -----------------------------
      // Ассеты: только safe, door и bottle
      // -----------------------------
      const assets = {
        safe: null,
        door: null,
        bottle: null,
      };

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      async function loadAssets() {
        try {
          const [safe, door, bottle] = await Promise.all([
            loadImage("assets/safe.png"),
            loadImage("assets/door.png"),
            loadImage("assets/bottle.png"),
          ]);

          assets.safe = safe;
          assets.door = door;
          assets.bottle = bottle;
        } catch (e) {
          console.error("Ошибка загрузки ассетов:", e);
        }
      }

      // -----------------------------
      // Управление состоянием
      // -----------------------------
      function setError(text, shake = 0.45, flash = 0.35) {
        appState = STATE.ERROR;
        message = text;
        messageColor = COLORS.RED;
        shakeTimer = shake;
        errorFlash = flash;
      }

      function resetUI() {
        appState = STATE.INPUT;
        entered = "";
        message = "Введите 6-значный код";
        messageColor = COLORS.DIM;
        openProgress = 0;
        shakeTimer = 0;
        errorFlash = 0;
        resultSubmitted = false;
        continueButtonRect = null;
      }

      function leaveOpenToInput() {
        appState = STATE.INPUT;
        entered = "";
        message = "Введите 6-значный код";
        messageColor = COLORS.DIM;
        openProgress = 0;
      }


      function openTeamModal() {
        teamModalError.textContent = "";
        teamNameInput.value = "";
        teamModalBackdrop.classList.add("is-open");
        teamModalBackdrop.setAttribute("aria-hidden", "false");
        setTimeout(() => teamNameInput.focus(), 40);
      }

      function closeTeamModal() {
        teamModalBackdrop.classList.remove("is-open");
        teamModalBackdrop.setAttribute("aria-hidden", "true");
      }

      async function submitTeamResult(teamName) {
        if (!RESULTS_WEB_APP_URL || RESULTS_WEB_APP_URL.includes("PASTE_GOOGLE_APPS_SCRIPT")) {
          throw new Error("Не задан URL Google Apps Script Web App");
        }

        const payload = {
          teamName,
          clientTimeISO: new Date().toISOString(),
          source: "safe-simulator"
        };

        // no-cors нужен, чтобы статическая страница на GitHub Pages могла отправить данные в Apps Script
        // без пляски с CORS. Ответ прочитать нельзя, зато POST доходит. Да, веб-разработка — цирк с формальностями.
        await fetch(RESULTS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        return true;
      }

      async function finishTeam() {
        if (isSubmittingResult) return;

        const teamName = teamNameInput.value.trim();
        if (!teamName) {
          teamModalError.textContent = "Введите название команды";
          return;
        }

        isSubmittingResult = true;
        finishTeamButton.disabled = true;
        finishTeamButton.textContent = "Сохраняю...";
        teamModalError.textContent = "";

        try {
          await submitTeamResult(teamName);
          resultSubmitted = true;
          closeTeamModal();
          message = "Результат сохранён";
          messageColor = COLORS.GREEN;
        } catch (e) {
          console.error(e);
          teamModalError.textContent = e.message || "Не удалось сохранить результат";
        } finally {
          isSubmittingResult = false;
          finishTeamButton.disabled = false;
          finishTeamButton.textContent = "Закончить!";
        }
      }

      function drawContinueButton(x, y, w, h) {
        continueButtonRect = { x, y, w, h };

        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
        ctx.shadowBlur = S(16);
        ctx.shadowOffsetY = S(6);

        roundedRectPath(x, y, w, h, S(16));
        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, "#6ff091");
        g.addColorStop(1, "#32bd61");
        ctx.fillStyle = g;
        ctx.fill();

        ctx.shadowColor = "transparent";
        ctx.lineWidth = Math.max(1, S(1));
        ctx.strokeStyle = "rgba(255,255,255,0.28)";
        ctx.stroke();

        drawText("Продолжить", x + w / 2, y + h / 2, "#07110b", Math.round(h * 0.38), "center", "900");
        ctx.restore();
      }

      function canvasPointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        const touch = event.touches && event.touches[0] ? event.touches[0] : event.changedTouches && event.changedTouches[0] ? event.changedTouches[0] : event;
        return {
          x: touch.clientX - rect.left,
          y: touch.clientY - rect.top
        };
      }

      function pointInRect(p, r) {
        return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
      }

      // -----------------------------
      // Рисование сейфа
      // -----------------------------
      function drawFallbackSafe(cx, cy, scaleBoost = 1) {
        const w = Math.round(S(300) * scaleBoost);
        const h = Math.round(S(300) * scaleBoost);
        const x = Math.round(cx - w / 2);
        const y = Math.round(cy - h / 2);

        ctx.fillStyle = "#c99";
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "#543";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = "#f3c24d";
        ctx.fillRect(x + w * 0.35, y + h * 0.35, w * 0.30, h * 0.30);
      }

      function drawBottle(bx, by, safeW, safeH) {
        const maxBottleH = Math.round(safeH * 0.36);
        const maxBottleW = Math.round(safeW * 0.24);

        let bottleW = maxBottleW;
        let bottleH = maxBottleH;

        if (assets.bottle && assets.bottle.width && assets.bottle.height) {
          const ratio = assets.bottle.width / assets.bottle.height;
          bottleH = maxBottleH;
          bottleW = Math.round(bottleH * ratio);
          if (bottleW > maxBottleW) {
            bottleW = maxBottleW;
            bottleH = Math.round(bottleW / ratio);
          }
        }

        const bottleX = Math.round(bx + safeW * 0.50 - bottleW / 2);
        const bottleY = Math.round(by + safeH * 0.42);

        if (assets.bottle) {
          drawImageScaled(assets.bottle, bottleX, bottleY, bottleW, bottleH);
        } else {
          ctx.fillStyle = "#2e6a3e";
          ctx.fillRect(bottleX + bottleW * 0.35, bottleY, bottleW * 0.30, bottleH * 0.25);
          ctx.fillStyle = "#6fb56f";
          ctx.fillRect(bottleX + bottleW * 0.14, bottleY + bottleH * 0.22, bottleW * 0.72, bottleH * 0.70);
          ctx.fillStyle = "rgba(255,255,255,0.25)";
          ctx.fillRect(bottleX + bottleW * 0.25, bottleY + bottleH * 0.28, bottleW * 0.12, bottleH * 0.52);
        }

        return { x: bottleX, y: bottleY, w: bottleW, h: bottleH };
      }

      function drawElectronicDisplay(x, y, w, h, text, visualScale = 1) {
        const border = Math.max(2, Math.round(S(3) * visualScale));
        const radius = Math.round(S(8) * visualScale);

        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.32)";
        roundedRectPath(x + border * 1.4, y + border * 1.6, w, h, radius);
        ctx.fill();

        roundedRectPath(x, y, w, h, radius);
        const displayGradient = ctx.createLinearGradient(x, y, x, y + h);
        displayGradient.addColorStop(0, "#082316");
        displayGradient.addColorStop(1, COLORS.DISPLAY_BG);
        ctx.fillStyle = displayGradient;
        ctx.fill();

        ctx.lineWidth = border;
        ctx.strokeStyle = COLORS.DISPLAY_EDGE;
        ctx.stroke();

        ctx.fillStyle = "rgba(96,245,154,0.10)";
        roundedRectPath(x + border, y + border, w - border * 2, Math.round((h - border * 2) * 0.36), Math.max(2, radius - border));
        ctx.fill();

        const fontSize = Math.round(h * 0.55);
        drawText(text, x + w / 2, y + h / 2 + Math.round(h * 0.02), COLORS.DISPLAY_TEXT, fontSize, "center", "700", "Consolas, Courier New, monospace");
        ctx.restore();
      }

      function drawSafe(centerX, centerY, doorOpenAmount, shakeX = 0) {
        const isMobileLike = window.matchMedia("(max-width: 900px), (pointer: coarse)").matches;
        const sceneBoost = isMobileLike ? MOBILE_VISUAL_BOOST : 1;

        if (!assets.safe || !assets.door) {
          drawFallbackSafe(centerX + shakeX, centerY, sceneBoost);
          return;
        }

        const cx = centerX + shakeX;
        const cy = centerY;

        const safeW = Math.round(S(840) * SAFE_SCENE_SCALE * sceneBoost);
        const safeH = Math.round(S(840) * SAFE_SCENE_SCALE * sceneBoost);
        const doorW0 = safeW;
        const doorH0 = safeH;

        const bx = Math.round(cx - safeW / 2);
        const by = Math.round(cy - safeH / 2);

        ctx.fillStyle = "rgba(0,0,0,0.34)";
        ctx.beginPath();
        ctx.ellipse(bx + safeW / 2 + S(6), by + safeH - S(8), safeW / 2.1, S(14), 0, 0, Math.PI * 2);
        ctx.fill();

        // Корпус/внутренность сейфа
        drawImageScaled(assets.safe, bx, by, safeW, safeH);

        // Бутылка внутри сейфа, рисуем ДО двери, чтобы закрытая дверь её скрывала.
        const bottleBounds = drawBottle(bx, by, safeW, safeH);

        // Дверь теперь не сжимается. Она просто едет вправо, пока не уйдёт за экран.
        const tOpen = easeOutCubic(doorOpenAmount);
        const openDistance = Math.max(WIDTH - bx + doorW0 * 0.18, doorW0 * 1.35);
        const doorX = Math.round(bx + openDistance * tOpen);
        const doorY = by;

        drawImageScaled(assets.door, doorX, doorY, doorW0, doorH0);

        // Электронное табло живёт на двери, поэтому отъезжает вместе с ней.
        const displayW = Math.round(doorW0 * 0.42);
        const displayH = Math.round(doorH0 * 0.13);
        const displayCenterX = Math.round(doorX + doorW0 * 0.50);
        const displayCenterY = Math.round(doorY + doorH0 * 0.50);

        // Рисуем табло, пока дверь хоть как-то рядом с экраном. Вряд ли оно кому-то нужно за горизонтом.
        if (doorX < WIDTH + doorW0 * 0.2) {
          drawElectronicDisplay(
            displayCenterX - displayW / 2,
            displayCenterY - displayH / 2,
            displayW,
            displayH,
            displayDigits(entered),
            sceneBoost
          );
        }

        // Кнопка появляется после полного открытия сейфа.
        if (appState === STATE.OPEN && !resultSubmitted && bottleBounds) {
          const btnW = Math.round(safeW * 0.34);
          const btnH = Math.round(safeH * 0.075);
          const btnX = Math.round(bx + safeW * 0.50 - btnW / 2);
          const btnY = Math.round(bottleBounds.y - btnH - safeH * 0.045);
          drawContinueButton(btnX, btnY, btnW, btnH);
        } else {
          continueButtonRect = null;
        }
      }

      // -----------------------------
      // Управление вводом
      // -----------------------------
      function trySaveMainCode(newMain) {
        saveCodeToCloud(newMain).then((ok) => {
          if (ok) {
            MAIN_CODE = newMain;
            entered = "";
            appState = STATE.INPUT;
            message = "Основной код сохранён";
            messageColor = COLORS.GREEN;
          } else {
            setError("Ошибка сохранения", 0.2, 0.2);
          }
        });
      }

      function handleVirtualKey(key) {
        if (key === "reset") {
          resetUI();
          return;
        }

        if (appState === STATE.OPEN) {
          if (/^\d$/.test(key)) {
            leaveOpenToInput();
          } else if (key !== "reset") {
            return;
          }
        }

        if (![STATE.INPUT, STATE.SET_MAIN, STATE.ERROR].includes(appState)) return;

        if (key === "enter") {
          if (appState === STATE.SET_MAIN) {
            if (entered.length !== MAX_DIGITS) {
              setError("Основной код должен быть 6-значным", 0.2, 0.2);
            } else {
              trySaveMainCode(entered);
            }
            return;
          }

          if (appState === STATE.INPUT || appState === STATE.ERROR) {
            if (entered === MASTER_SET_MAIN) {
              appState = STATE.SET_MAIN;
              entered = "";
              message = "1990: введите новый 6-значный код";
              messageColor = COLORS.YELLOW;
              return;
            }

            if (entered.length !== MAX_DIGITS) {
              setError("Нужно ввести 6 цифр", 0.2, 0.2);
              return;
            }

            if (entered === MAIN_CODE) {
              appState = STATE.OPENING;
              message = "Код принят";
              messageColor = COLORS.GREEN;
              return;
            }

            setError("Неверная комбинация");
          }
          return;
        }

        if (key === "back") {
          entered = entered.slice(0, -1);
          if (appState === STATE.ERROR) {
            appState = STATE.INPUT;
            message = "Введите 6-значный код";
            messageColor = COLORS.DIM;
          }
          return;
        }

        if (/^\d$/.test(key) && entered.length < MAX_DIGITS) {
          entered += key;
          if (appState === STATE.ERROR) {
            appState = STATE.INPUT;
            message = "Введите 6-значный код";
            messageColor = COLORS.DIM;
          }
        }
      }

      // Desktop keyboard
      window.addEventListener("keydown", (e) => {
        const key = e.key;
        if (key === "Escape") return;

        if (key === "Enter") {
          e.preventDefault();
          handleVirtualKey("enter");
          return;
        }
        if (key === "Backspace") {
          e.preventDefault();
          handleVirtualKey("back");
          return;
        }
        if (key.toLowerCase() === "r") {
          e.preventDefault();
          handleVirtualKey("reset");
          return;
        }
        if (/^\d$/.test(key)) {
          e.preventDefault();
          handleVirtualKey(key);
        }
      });

      // Mobile controls
      mobileControls.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-key]");
        if (!btn) return;
        handleVirtualKey(btn.dataset.key);
      });
      mobileControls.addEventListener("touchstart", () => {}, { passive: true });


      canvas.addEventListener("pointerdown", (e) => {
        if (teamModalBackdrop.classList.contains("is-open")) return;
        const p = canvasPointFromEvent(e);
        if (appState === STATE.OPEN && !resultSubmitted && pointInRect(p, continueButtonRect)) {
          e.preventDefault();
          openTeamModal();
        }
      });

      finishTeamButton.addEventListener("click", finishTeam);

      teamNameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          finishTeam();
        }
      });

      // -----------------------------
      // Update / Draw
      // -----------------------------
      function update(dt) {
        if (appState === STATE.OPENING) {
          openProgress += dt * 0.60;
          if (openProgress >= 1) {
            openProgress = 1;
            appState = STATE.OPEN;
            message = "Сейф открыт. R — сброс";
            messageColor = COLORS.GREEN;
          }
        }

        if (appState === STATE.ERROR) {
          if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
          if (errorFlash > 0) errorFlash = Math.max(0, errorFlash - dt);
        }

        if ([STATE.INPUT, STATE.SET_MAIN, STATE.ERROR].includes(appState)) {
          openProgress = Math.max(0, openProgress - dt * 1.2);
        }
      }

      function draw() {
        drawModernBackground();

        const isMobileLike = window.matchMedia("(max-width: 900px), (pointer: coarse)").matches;
        const V = (v) => isMobileLike ? Math.max(1, Math.round(S(v) * MOBILE_VISUAL_BOOST)) : S(v);

        // Верхняя современная плашка
        const topRect = {
          x: S(34),
          y: S(22),
          w: WIDTH - S(68),
          h: S(88)
        };
        drawModernTopPanel(topRect.x, topRect.y, topRect.w, topRect.h);

        const titleY = topRect.y + Math.round(topRect.h * 0.34);
        const msgY = topRect.y + Math.round(topRect.h * 0.70);
        drawText("СИМУЛЯТОР СЕЙФА", WIDTH / 2, titleY, COLORS.ACCENT, V(26), "center", "800");
        drawText(message, WIDTH / 2, msgY, messageColor, V(16), "center", "600");

        // Shake
        let shakeX = 0;
        if (shakeTimer > 0) {
          const amp = Math.max(1, Math.round(S(10) * Math.min(1, shakeTimer / 0.45)));
          shakeX = Math.round(Math.sin(performance.now() * 0.06) * amp);
        }

        // Красная вспышка
        if (errorFlash > 0) {
          ctx.fillStyle = `rgba(255,50,50,${0.24 * Math.min(1, errorFlash / 0.35)})`;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        const mobileRect = isMobileLike ? mobileControls.getBoundingClientRect() : null;
        const keypadTop = (isMobileLike && mobileRect) ? mobileRect.top : HEIGHT;

        const safeBottomLimit = isMobileLike
          ? keypadTop - S(MOBILE_KEYPAD_GAP)
          : HEIGHT;

        // На мобиле сейф центрируется между верхней панелью и клавиатурой.
        const safeCenterY = isMobileLike
          ? Math.round((topRect.y + topRect.h + S(MOBILE_TOP_SAFE_GAP) + safeBottomLimit) / 2 + S(MOBILE_SAFE_Y_BIAS))
          : HEIGHT / 2 + S(52);

        drawSafe(WIDTH / 2, safeCenterY, openProgress, shakeX);

        const hint = "Enter: подтвердить   •   Backspace: удалить   •   1990: сменить код   •   R: сброс";
        if (!isMobileLike) {
          drawText(hint, WIDTH / 2, HEIGHT - V(30), COLORS.DIM, V(13), "center", "600");
        }
      }

      function frame(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      async function initCode() {
        MAIN_CODE = await loadCodeFromCloud();
        subscribeToCode((main) => {
          MAIN_CODE = main;
        });
      }

      async function boot() {
        resize();
        await loadAssets();
        await initCode();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      boot();
    })();
  </script>
</body>
</html>
